<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 220" width="600" height="220">
  <rect width="600" height="220" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2" rx="8" />
  
  <!-- Client Layer -->
  <rect x="30" y="40" width="130" height="140" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2" rx="6" />
  <text x="95" y="70" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1E3A8A" text-anchor="middle">Client Tier</text>
  <text x="95" y="100" font-family="Arial, sans-serif" font-size="11" fill="#475569" text-anchor="middle">React 18 SPA</text>
  <text x="95" y="125" font-family="Arial, sans-serif" font-size="11" fill="#475569" text-anchor="middle">Mobile Browser</text>
  <text x="95" y="150" font-family="Arial, sans-serif" font-size="11" fill="#475569" text-anchor="middle">HTML5 Semantics</text>

  <!-- Arrow 1 -->
  <path d="M 160 110 L 220 110" stroke="#2563EB" stroke-width="3" fill="none" marker-end="url(#arrow)" />
  <text x="190" y="100" font-family="Arial, sans-serif" font-size="10" fill="#2563EB" text-anchor="middle">HTTP/JSON</text>

  <!-- API Layer -->
  <rect x="230" y="40" width="140" height="140" fill="#F0FDF4" stroke="#22C55E" stroke-width="2" rx="6" />
  <text x="300" y="70" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#15803D" text-anchor="middle">REST API Tier</text>
  <text x="300" y="100" font-family="Arial, sans-serif" font-size="11" fill="#475569" text-anchor="middle">Node.js + Express</text>
  <text x="300" y="125" font-family="Arial, sans-serif" font-size="11" fill="#475569" text-anchor="middle">JWT Security Guard</text>
  <text x="300" y="150" font-family="Arial, sans-serif" font-size="11" fill="#475569" text-anchor="middle">Route Controllers</text>

  <!-- Arrow 2 -->
  <path d="M 370 110 L 430 110" stroke="#16A34A" stroke-width="3" fill="none" />
  <text x="400" y="100" font-family="Arial, sans-serif" font-size="10" fill="#16A34A" text-anchor="middle">SQL (Pool)</text>

  <!-- DB Layer -->
  <rect x="440" y="40" width="130" height="140" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2" rx="6" />
  <text x="505" y="70" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#B45309" text-anchor="middle">Database Tier</text>
  <text x="505" y="100" font-family="Arial, sans-serif" font-size="11" fill="#475569" text-anchor="middle">MySQL RDBMS</text>
  <text x="505" y="125" font-family="Arial, sans-serif" font-size="11" fill="#475569" text-anchor="middle">Relational Tables</text>
  <text x="505" y="150" font-family="Arial, sans-serif" font-size="11" fill="#475569" text-anchor="middle">Param Queries</text>
</svg>
